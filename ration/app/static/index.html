<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<title>rationPlaner</title>
<link rel="stylesheet" href="static/app.css?v={{version}}">
<script>
  // Theme vor dem ersten Rendern setzen, damit nichts aufblitzt.
  try { const t = JSON.parse(localStorage.getItem("ration.theme")); if (t && t !== "auto") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="shell">
  <aside id="nav" aria-label="Menü">
    <div class="brand"><span class="logo">🥕</span><span>rationPlaner</span><small>v{{version}}</small></div>
    <nav id="menu"></nav>
    <div class="nav-fuss"><small id="statusline" class="muted"></small></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <div class="kopfbereich">
    <header class="top">
      <button class="icon burger" id="burger" aria-label="Menü öffnen">☰</button>
      <button class="icon zurueck" id="zurueck" aria-label="Zurück" hidden>‹</button>
      <h1 id="titel">rationPlaner</h1>
      <div class="suche"><input id="suche" type="search" placeholder="Suchen … ( / )" autocomplete="off">
        <div id="treffer" class="treffer" hidden></div></div>
      <div id="importstatus" hidden></div>
    </header>
    <nav id="tabs" class="tabs" aria-label="Unterseiten" hidden></nav>
    </div>
    <main id="view"></main>
  </div>
</div>
<nav id="unten" class="unten" aria-label="Hauptmenü"></nav>
<div id="toasts" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<script type="module" src="static/js/main.js?v={{version}}"></script>
</body>
</html>
