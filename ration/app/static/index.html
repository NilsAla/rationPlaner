<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rationPlaner</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --text: #1c1c1c; --muted: #6b6b6b; --line: #e3e3df;
    --accent: #2f6f4f; --warn: #b4531a; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161716; --card: #202221; --text: #e8e8e6; --muted: #9a9a96; --line: #333532;
            --accent: #6cc093; --warn: #e39a5c; --bad: #ef7d75; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { font-size: 18px; margin: 0; }
  header small, .muted { color: var(--muted); }
  nav { display: flex; gap: 6px; padding: 0 16px 10px; overflow-x: auto; }
  nav button { border: 1px solid var(--line); background: var(--card); color: var(--text);
               padding: 7px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 0 16px 32px; max-width: 760px; }
  section { display: none; } section.on { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  ol, ul { margin: 6px 0; padding-left: 20px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  .nw { white-space: nowrap; }
  .tag { font-size: 12px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); }
  .tag.ok { color: var(--accent); } .tag.vorschlag, .tag.schaetzung { color: var(--warn); }
  .tag.unbekannt, .tag.einheit { color: var(--bad); }
  textarea { width: 100%; min-height: 80px; font: 12px monospace; border: 1px solid var(--line);
             border-radius: 8px; background: var(--bg); color: var(--text); }
  .soon { color: var(--warn); } .over { color: var(--bad); }
  label { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; }
  input, select { width: 100%; padding: 8px; font: inherit; border: 1px solid var(--line);
                  border-radius: 8px; background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  button.go { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent);
              color: #fff; font: inherit; font-weight: 600; cursor: pointer; width: 100%; }
  #msg { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 10px 14px; border-radius: 8px;
         background: var(--text); color: var(--bg); display: none; max-width: 728px; }
</style>
</head>
<body>
<header><h1>rationPlaner</h1><small id="statusline">v{{version}}</small></header>
<nav>
  <button data-tab="heute" class="on">Heute</button>
  <button data-tab="woche">Woche</button>
  <button data-tab="bestand">Bestand</button>
  <button data-tab="packungen">Packungen</button>
  <button data-tab="import">Import</button>
</nav>
<main>
  <section id="heute" class="on"></section>
  <section id="woche"></section>
  <section id="bestand"></section>
  <section id="packungen"></section>
  <section id="import"></section>
</main>
<div id="msg"></div>
<script>
// Alle Pfade relativ, damit es hinter Ingress funktioniert.
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n) => Number(n).toLocaleString("de-DE", {maximumFractionDigits: 1});
const iso = (d) => d.toISOString().slice(0, 10);
const dmy = (s) => s ? new Date(s).toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit", year: "2-digit"}) : "";
async function api(path, opts = {}) {
  const r = await fetch("api/v1/" + path, {headers: {"Content-Type": "application/json"}, ...opts});
  const body = r.status === 204 ? null : await r.json();
  if (!r.ok) throw new Error(Array.isArray(body?.detail) ? body.detail.map((d) => d.msg).join(", ") : body?.detail ?? r.statusText);
  return body;
}
function say(text) { const m = $("#msg"); m.textContent = text; m.style.display = "block";
  clearTimeout(say.t); say.t = setTimeout(() => (m.style.display = "none"), 4000); }
async function guarded(fn) { try { await fn(); } catch (e) { say(e.message); } }

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button, section").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); $("#" + b.dataset.tab).classList.add("on"); load(b.dataset.tab);
});

async function loadStatus() { const s = await api("status"); $("#statusline").textContent = s.text; }

async function loadHeute() {
  const h = await api("heute"); const el = $("#heute");
  if (!h.rezept) { el.innerHTML = `<div class="card"><h2>Heute ist nichts geplant</h2>
    <p class="muted">Im Tab „Woche“ ein Rezept für heute eintragen.</p></div>`; return; }
  const r = h.rezept;
  el.innerHTML = `<div class="card"><h2>${esc(r.name)}</h2>
    <p class="muted">${r.portionen} Portion(en)${h.status === "gekocht" ? " · gekocht" : ""}</p>
    <ul>${r.zutaten.map((z) => `<li>${fmt(z.menge)} ${esc(z.einheit)} ${esc(z.name)}</li>`).join("")}</ul>
    ${r.schritte.length ? `<ol>${r.schritte.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}</div>
    <div class="card"><h2>Gekocht</h2><div class="row">
      <div><label>Gekocht (Portionen)</label><input id="pg" type="number" min="1" max="12" value="${r.portionen}"></div>
      <div><label>Gegessen (Portionen)</label><input id="pe" type="number" min="0" max="12" value="${r.portionen}"></div></div>
      <button class="go" id="kochen">Gekocht buchen</button></div>`;
  $("#kochen").onclick = () => guarded(async () => {
    const e = await api("gekocht", {method: "POST", body: JSON.stringify({
      rezept_id: r.id, portionen_gekocht: +$("#pg").value, portionen_gegessen: +$("#pe").value})});
    const fehl = e.fehlend.map((p) => `${p.name} ${fmt(p.menge)} ${p.einheit}`).join(", ");
    say(`${e.abgebucht.length} Zutaten abgebucht` + (fehl ? ` · fehlte: ${fehl}` : ""));
    load("heute");
  });
}

async function loadWoche() {
  const [plan, rezepte] = await Promise.all([api("plan?tage=7"), api("rezepte")]);
  const byDay = Object.fromEntries(plan.map((p) => [p.datum, p]));
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return d; });
  const opts = (sel) => `<option value="">–</option>` + rezepte.map((r) =>
    `<option value="${r.id}" ${r.id === sel ? "selected" : ""}>${esc(r.name)}</option>`).join("");
  $("#woche").innerHTML = `<div class="card"><h2>Diese Woche</h2><table>${days.map((d) => {
    const k = iso(d), p = byDay[k];
    return `<tr><td>${d.toLocaleDateString("de-DE", {weekday: "short", day: "2-digit", month: "2-digit"})}</td>
      <td><select data-day="${k}">${opts(p?.rezept_id)}</select></td>
      <td style="width:70px"><input type="number" min="1" max="12" value="${p?.portionen ?? ""}" data-por="${k}"></td>
      <td class="muted">${p?.status === "gekocht" ? "✓" : ""}</td></tr>`; }).join("")}</table>
    ${rezepte.length ? "" : `<p class="muted">Noch keine Rezepte in Grocy.</p>`}
    <button class="go" id="testdaten" style="background:none;color:var(--accent);border:1px solid var(--line)">Testrezepte in Grocy anlegen</button>
    <button class="go" id="einkauf">Einkaufsliste erzeugen</button></div>`;
  const basis = Object.fromEntries(rezepte.map((r) => [r.id, r.portionen]));
  const save = (k, rezeptGewechselt) => guarded(async () => {
    const id = $(`[data-day="${k}"]`).value, por = $(`[data-por="${k}"]`);
    // Neues Rezept: Grundportionen des Rezepts übernehmen, nicht 1.
    if (id && (rezeptGewechselt || !por.value)) por.value = basis[id] ?? 1;
    if (!id) await api(`plan/${k}`, {method: "DELETE"});
    else await api(`plan/${k}`, {method: "PUT", body: JSON.stringify({rezept_id: id, portionen: +por.value})});
    say("Plan gespeichert");
  });
  document.querySelectorAll("[data-day],[data-por]").forEach((x) =>
    x.onchange = () => save(x.dataset.day ?? x.dataset.por, "day" in x.dataset));
  $("#testdaten").onclick = () => guarded(async () => {
    const e = await api("testdaten", {method: "POST"});
    say(`${e.rezepte.filter((r) => r.neu).length} Testrezepte angelegt`); load("woche");
  });
  $("#einkauf").onclick = () => guarded(async () => {
    const e = await api("einkaufsliste", {method: "POST", body: JSON.stringify({tage: 7})});
    say(e.hinzugefuegt.length ? `${e.hinzugefuegt.length} Einträge hinzugefügt`
      : e.schon_auf_liste.length ? "Steht schon alles auf der Liste" : "Nichts fehlt");
  });
}

async function loadBestand() {
  const [bestand, produkte, orte] = await Promise.all([api("bestand"), api("produkte"), api("lagerorte")]);
  const today = iso(new Date()), soon = iso(new Date(Date.now() + 3 * 864e5));
  $("#bestand").innerHTML = `<div class="card"><h2>Einbuchen</h2>
    <label>Produkt</label><select id="ep">${produkte.map((p) => `<option value="${p.id}">${esc(p.name)} (${esc(p.einheit)})</option>`).join("")}</select>
    <div class="row"><div><label>Menge</label><input id="em" type="number" min="0" step="any"></div>
      <div><label>MHD (leer = Standard)</label><input id="ed" type="date"></div></div>
    <label>Lagerort</label><select id="el"><option value="">Standard des Produkts</option>
      ${orte.map((o) => `<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select>
    <button class="go" id="buchen">Einbuchen</button></div>
    <div class="card"><h2>Bestand</h2>${bestand.length ? `<table>${bestand.map((b) => {
      const cls = b.mhd && b.mhd < today ? "over" : b.mhd && b.mhd <= soon ? "soon" : "";
      return `<tr><td>${esc(b.name)}</td><td class="nw">${fmt(b.menge)} ${esc(b.einheit)}</td>
        <td class="muted">${esc(b.lagerort)}</td><td class="nw ${cls}">${dmy(b.mhd)}</td></tr>`; }).join("")}</table>`
      : `<p class="muted">Leer.</p>`}</div>`;
  $("#buchen").onclick = () => guarded(async () => {
    await api("bestand", {method: "POST", body: JSON.stringify({produkt_id: $("#ep").value,
      menge: +$("#em").value, mhd: $("#ed").value || null, lagerort_id: $("#el").value || null})});
    say("Eingebucht"); load("bestand");
  });
}

async function loadPackungen(auswahl) {
  const liste = await api("packungen"), el = $("#packungen");
  if (!liste.length) { el.innerHTML = `<div class="card"><p class="muted">Keine Produkte.</p></div>`; return; }
  const p = liste.find((x) => x.produkt_id === auswahl) ?? liste[0];
  const groesse = (g) => `${esc(g.einheit)} ${fmt(g.menge)} ${esc(p.einheit)}`;
  el.innerHTML = `<div class="card"><h2>Packungsgrößen</h2>
    <label>Produkt</label><select id="pp">${liste.map((x) =>
      `<option value="${x.produkt_id}" ${x.produkt_id === p.produkt_id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
    <label>Standard (meistverkaufte Größe)</label>
    <div class="row"><input id="se" placeholder="Einheit, z. B. Dose" value="${esc(p.standard?.einheit ?? "")}">
      <input id="sm" type="number" min="0" step="any" placeholder="Menge in ${esc(p.einheit)}" value="${p.standard?.menge ?? ""}"></div>
    <button class="go" id="sstd">Standard speichern</button>
    <label>Weitere Größen</label>
    ${p.weitere.length ? `<table>${p.weitere.map((w) => `<tr><td>${groesse(w)}</td>
      <td class="muted">${esc(w.quelle)}${w.gueltig_bis ? " bis " + dmy(w.gueltig_bis) : ""}</td>
      <td style="width:40px"><button data-del="${w.id}" style="border:0;background:none;color:var(--bad);cursor:pointer">✕</button></td></tr>`).join("")}</table>`
      : `<p class="muted">Keine.</p>`}
    <div class="row"><input id="we" placeholder="Einheit"><input id="wm" type="number" min="0" step="any" placeholder="Menge in ${esc(p.einheit)}"></div>
    <button class="go" id="wadd" style="background:none;color:var(--accent);border:1px solid var(--line)">Größe hinzufügen</button></div>
    <div class="card"><h2>Übersicht</h2><table>${liste.map((x) => `<tr><td>${esc(x.name)}</td>
      <td>${x.standard ? `${esc(x.standard.einheit)} ${fmt(x.standard.menge)} ${esc(x.einheit)}` : `<span class="muted">–</span>`}</td>
      <td class="muted">${x.weitere.map((w) => fmt(w.menge)).join(", ")}</td></tr>`).join("")}</table></div>`;
  const id = p.produkt_id;
  $("#pp").onchange = () => guarded(() => loadPackungen($("#pp").value));
  $("#sstd").onclick = () => guarded(async () => {
    await api(`produkte/${id}/packung`, {method: "PUT", body: JSON.stringify({einheit: $("#se").value, menge: +$("#sm").value})});
    say("Standard gespeichert"); loadPackungen(id);
  });
  $("#wadd").onclick = () => guarded(async () => {
    await api(`produkte/${id}/packungen`, {method: "POST", body: JSON.stringify({einheit: $("#we").value, menge: +$("#wm").value})});
    say("Größe hinzugefügt"); loadPackungen(id);
  });
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => guarded(async () => {
    await api(`packungen/${b.dataset.del}`, {method: "DELETE"}); loadPackungen(id);
  }));
}

async function loadImport() {
  $("#import").innerHTML = `<div class="card"><h2>Rezept per Link importieren</h2>
    <label>Link (z. B. HelloFresh)</label><input id="iu" type="url" placeholder="https://www.hellofresh.de/recipes/…">
    <details><summary class="muted" style="margin-top:8px;font-size:13px">Seite blockt? Quelltext einfügen</summary>
      <textarea id="ih" placeholder="Seitenquelltext (Strg+U, alles kopieren)"></textarea></details>
    <button class="go" id="iload">Vorschau laden</button>
    <p class="muted" style="font-size:13px">Übernommen werden nur Zutaten und Mengen, die Zubereitung bleibt als Link zur Quelle.</p></div>
    <div id="ivor"></div>`;
  $("#iload").onclick = () => guarded(async () => {
    const v = await api("import/vorschau", {method: "POST",
      body: JSON.stringify({url: $("#iu").value, html: $("#ih").value || null})});
    zeigeVorschau(v, await api("produkte"));
  });
}

function zeigeVorschau(v, produkte) {
  const einheit = Object.fromEntries(produkte.map((p) => [p.id, p.einheit]));
  const opts = (sel) => `<option value="">– weglassen –</option><option value="+neu">+ neues Produkt</option>` +
    produkte.map((p) => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  $("#ivor").innerHTML = `<div class="card"><h2>Vorschau</h2>
    ${v.dublette ? `<p class="over">Dieses Rezept gibt es schon (ID ${esc(v.dublette)}).</p>` : ""}
    <div class="row"><div><label>Name</label><input id="in" value="${esc(v.name)}"></div>
      <div style="flex:0 0 90px"><label>Portionen</label><input id="ip" type="number" min="1" max="12" value="${v.portionen}"></div></div>
    <table>${v.zutaten.map((z) => `<tr><td colspan="3" style="border-top:1px solid var(--line);padding-bottom:0">
        ${esc(z.text)} <span class="tag ${z.status}">${esc(z.status)}</span>
        ${z.hinweis ? `<span class="muted" style="font-size:12px"> ${esc(z.hinweis)}</span>` : ""}</td></tr>
      <tr><td style="border:0"><select data-zp="${z.index}">${opts(z.produkt_id)}</select>
          <input data-zn="${z.index}" placeholder="Name neues Produkt" value="${esc(z.name)}" style="display:none;margin-top:4px"></td>
        <td style="border:0;width:90px"><input data-zm="${z.index}" type="number" min="0" step="any" value="${z.menge_bestand ?? ""}"></td>
        <td style="border:0;width:30px" class="muted" data-ze="${z.index}">${esc(einheit[z.produkt_id] ?? "g")}</td></tr>`).join("")}</table>
    <button class="go" id="iok">In Grocy übernehmen</button></div>`;
  document.querySelectorAll("[data-zp]").forEach((sel) => sel.onchange = () => {
    const i = sel.dataset.zp;
    $(`[data-zn="${i}"]`).style.display = sel.value === "+neu" ? "block" : "none";
    $(`[data-ze="${i}"]`).textContent = einheit[sel.value] ?? "g";
  });
  $("#iok").onclick = () => guarded(async () => {
    const zutaten = [];
    for (const sel of document.querySelectorAll("[data-zp]")) {
      const i = +sel.dataset.zp, menge = $(`[data-zm="${i}"]`).value;
      if (!sel.value) continue;
      if (menge === "") throw new Error(`Menge fehlt: ${v.zutaten[i].text}`);
      zutaten.push(sel.value === "+neu"
        ? {index: i, neu_anlegen: $(`[data-zn="${i}"]`).value, menge: +menge}
        : {index: i, produkt_id: sel.value, menge: +menge});
    }
    const e = await api(`import/${v.import_id}/uebernehmen`, {method: "POST", body: JSON.stringify({
      name: $("#in").value, portionen: +$("#ip").value, zutaten, trotz_dublette: !!v.dublette})});
    say(`„${e.name}“ angelegt · ${e.zutaten} Zutaten` + (e.neue_produkte.length ? ` · neu: ${e.neue_produkte.join(", ")}` : ""));
    $("#ivor").innerHTML = "";
  });
}

function load(tab) {
  guarded(loadStatus);
  guarded({heute: loadHeute, woche: loadWoche, bestand: loadBestand, packungen: () => loadPackungen(), import: loadImport}[tab]);
}
load("heute");
</script>
</body>
</html>
