<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rationPlaner</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --text: #1c1c1c; --muted: #6b6b6b; --line: #e3e3df;
    --accent: #2f6f4f; --warn: #b4531a; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161716; --card: #202221; --text: #e8e8e6; --muted: #9a9a96; --line: #333532;
            --accent: #6cc093; --warn: #e39a5c; --bad: #ef7d75; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { font-size: 18px; margin: 0; }
  header small, .muted { color: var(--muted); }
  nav { display: flex; gap: 6px; padding: 0 16px 10px; overflow-x: auto; }
  nav button { border: 1px solid var(--line); background: var(--card); color: var(--text);
               padding: 7px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 0 16px 32px; max-width: 760px; }
  section { display: none; } section.on { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  ol, ul { margin: 6px 0; padding-left: 20px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  .nw { white-space: nowrap; }
  .tag { font-size: 12px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); }
  .tag.schaetzung { color: var(--warn); } .tag.pruefen { color: var(--bad); }
  textarea { width: 100%; min-height: 80px; font: 12px monospace; border: 1px solid var(--line);
             border-radius: 8px; background: var(--bg); color: var(--text); }
  .soon { color: var(--warn); } .over { color: var(--bad); }
  label { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; }
  input, select { width: 100%; padding: 8px; font: inherit; border: 1px solid var(--line);
                  border-radius: 8px; background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  button.go { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent);
              color: #fff; font: inherit; font-weight: 600; cursor: pointer; width: 100%; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--accent); }
  .dot.knapp { background: var(--warn); } .dot.fehlt { background: var(--bad); }
  .list > div { padding: 9px 4px; border-top: 1px solid var(--line); cursor: pointer; }
  .list > div:hover { background: var(--bg); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chips button, button.ghost { border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 5px 10px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair > div { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 13px; }
  .pair dl { margin: 0; } .pair dt { color: var(--muted); font-size: 12px; } .pair dd { margin: 0 0 4px; }
  #msg { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 10px 14px; border-radius: 8px;
         background: var(--text); color: var(--bg); display: none; max-width: 728px; }
</style>
</head>
<body>
<header><h1>rationPlaner</h1><small id="statusline">v{{version}}</small></header>
<nav>
  <button data-tab="heute" class="on">Heute</button>
  <button data-tab="woche">Woche</button>
  <button data-tab="rezepte">Rezepte</button>
  <button data-tab="bestand">Bestand</button>
  <button data-tab="produkte">Produkte</button>
  <button data-tab="packungen">Packungen</button>
  <button data-tab="bon">Bon</button>
  <button data-tab="import">Import</button>
</nav>
<main>
  <section id="heute" class="on"></section>
  <section id="woche"></section>
  <section id="rezepte"></section>
  <section id="bestand"></section>
  <section id="produkte"></section>
  <section id="packungen"></section>
  <section id="bon"></section>
  <section id="import"></section>
</main>
<div id="msg"></div>
<script>
// Alle Pfade relativ, damit es hinter Ingress funktioniert.
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n) => Number(n).toLocaleString("de-DE", {maximumFractionDigits: 1});
const eur = (n) => Number(n).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
const iso = (d) => d.toISOString().slice(0, 10);
const dmy = (s) => s ? new Date(s).toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit", year: "2-digit"}) : "";
async function api(path, opts = {}) {
  const headers = opts.body instanceof FormData ? {} : {"Content-Type": "application/json"};
  const r = await fetch("api/v1/" + path, {headers, ...opts});
  const body = r.status === 204 ? null : await r.json();
  if (!r.ok) throw new Error(Array.isArray(body?.detail) ? body.detail.map((d) => d.msg).join(", ") : body?.detail ?? r.statusText);
  return body;
}
function say(text) { const m = $("#msg"); m.textContent = text; m.style.display = "block";
  clearTimeout(say.t); say.t = setTimeout(() => (m.style.display = "none"), 4000); }
async function guarded(fn) { try { await fn(); } catch (e) { say(e.message); } }

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button, section").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); $("#" + b.dataset.tab).classList.add("on"); load(b.dataset.tab);
});

async function loadStatus() { const s = await api("status"); $("#statusline").textContent = s.text; }

async function loadHeute() {
  const h = await api("heute"); const el = $("#heute");
  if (!h.rezept) { el.innerHTML = `<div class="card"><h2>Heute ist nichts geplant</h2>
    <p class="muted">Im Tab „Woche“ ein Rezept für heute eintragen.</p></div>`; return; }
  const r = h.rezept;
  el.innerHTML = `<div class="card"><h2>${esc(r.name)}</h2>
    <p class="muted">${r.portionen} Portion(en)${h.status === "gekocht" ? " · gekocht" : ""}</p>
    <ul>${r.zutaten.map((z) => `<li>${fmt(z.menge)} ${esc(z.einheit)} ${esc(z.name)}</li>`).join("")}</ul>
    ${r.schritte.length ? `<ol>${r.schritte.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}</div>
    <div class="card"><h2>Gekocht</h2><div class="row">
      <div><label>Gekocht (Portionen)</label><input id="pg" type="number" min="1" max="12" value="${r.portionen}"></div>
      <div><label>Gegessen (Portionen)</label><input id="pe" type="number" min="0" max="12" value="${r.portionen}"></div></div>
      <button class="go" id="kochen">Gekocht buchen</button></div>`;
  $("#kochen").onclick = () => guarded(async () => {
    const e = await api("gekocht", {method: "POST", body: JSON.stringify({
      rezept_id: r.id, portionen_gekocht: +$("#pg").value, portionen_gegessen: +$("#pe").value})});
    const fehl = e.fehlend.map((p) => `${p.name} ${fmt(p.menge)} ${p.einheit}`).join(", ");
    say(`${e.abgebucht.length} Zutaten abgebucht` + (e.rest ? ` · ${fmt(e.rest.menge)} Portion(en) als Rest eingebucht` : "")
      + (fehl ? ` · fehlte: ${fehl}` : ""));
    await load("heute");
    if (e.fuellstand_fragen.length) fuellstandFragen(e.fuellstand_fragen);
  });
}

function fuellstandFragen(fragen) {
  $("#heute").insertAdjacentHTML("beforeend", `<div class="card" id="ffr"><h2>Wie voll ist noch …?</h2>
    <table>${fragen.map((f) => `<tr><td>${esc(f.name)}</td><td class="nw" style="text-align:right">
      ${["voll", "knapp", "leer"].map((st) => `<button class="ghost" data-fs="${f.produkt_id}" data-st="${st}">${st}</button>`).join(" ")}</td></tr>`).join("")}</table></div>`);
  document.querySelectorAll("[data-fs]").forEach((b) => b.onclick = () => guarded(async () => {
    await api(`fuellstand/${b.dataset.fs}`, {method: "PUT", body: JSON.stringify({stand: b.dataset.st})});
    b.closest("tr").remove(); say("Füllstand gespeichert");
    if (!document.querySelector("#ffr [data-fs]")) $("#ffr").remove();
  }));
}

async function loadWoche() {
  const [plan, rezepte] = await Promise.all([api("plan?tage=7"), api("rezepte")]);
  const byDay = Object.fromEntries(plan.map((p) => [p.datum, p]));
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return d; });
  const opts = (sel) => `<option value="">–</option>` + rezepte.map((r) =>
    `<option value="${r.id}" ${r.id === sel ? "selected" : ""}>${esc(r.name)}</option>`).join("");
  $("#woche").innerHTML = `<div class="card"><h2>Diese Woche</h2><table>${days.map((d) => {
    const k = iso(d), p = byDay[k];
    return `<tr><td>${d.toLocaleDateString("de-DE", {weekday: "short", day: "2-digit", month: "2-digit"})}</td>
      <td><select data-day="${k}">${opts(p?.rezept_id)}</select></td>
      <td style="width:70px"><input type="number" min="1" max="12" value="${p?.portionen ?? ""}" data-por="${k}"></td>
      <td class="muted">${p?.status === "gekocht" ? "✓" : ""}</td></tr>`; }).join("")}</table>
    ${rezepte.length ? "" : `<p class="muted">Noch keine Rezepte in Grocy.</p>`}
    <button class="go" id="testdaten" style="background:none;color:var(--accent);border:1px solid var(--line)">Testrezepte in Grocy anlegen</button>
    <button class="go" id="einkauf">Einkaufsliste erzeugen</button></div>`;
  const basis = Object.fromEntries(rezepte.map((r) => [r.id, r.portionen]));
  const save = (k, rezeptGewechselt) => guarded(async () => {
    const id = $(`[data-day="${k}"]`).value, por = $(`[data-por="${k}"]`);
    // Neues Rezept: Grundportionen des Rezepts übernehmen, nicht 1.
    if (id && (rezeptGewechselt || !por.value)) por.value = basis[id] ?? 1;
    if (!id) await api(`plan/${k}`, {method: "DELETE"});
    else await api(`plan/${k}`, {method: "PUT", body: JSON.stringify({rezept_id: id, portionen: +por.value})});
    say("Plan gespeichert");
  });
  document.querySelectorAll("[data-day],[data-por]").forEach((x) =>
    x.onchange = () => save(x.dataset.day ?? x.dataset.por, "day" in x.dataset));
  $("#testdaten").onclick = () => guarded(async () => {
    const e = await api("testdaten", {method: "POST"});
    say(`${e.rezepte.filter((r) => r.neu).length} Testrezepte angelegt`); load("woche");
  });
  $("#einkauf").onclick = () => guarded(async () => {
    const e = await api("einkaufsliste", {method: "POST", body: JSON.stringify({tage: 7})});
    say(e.hinzugefuegt.length ? `${e.hinzugefuegt.length} Einträge hinzugefügt`
      : e.schon_auf_liste.length ? "Steht schon alles auf der Liste" : "Nichts fehlt");
  });
}

async function loadBestand() {
  const [bestand, produkte, orte, reste, fuell] = await Promise.all([api("bestand"), api("produkte"), api("lagerorte"),
    api("reste"), api("fuellstand")]);
  const today = iso(new Date()), soon = iso(new Date(Date.now() + 3 * 864e5));
  $("#bestand").innerHTML = `<div class="card"><h2>Einbuchen</h2>
    <label>Produkt</label><select id="ep">${produkte.map((p) => `<option value="${p.id}">${esc(p.name)} (${esc(p.einheit)})</option>`).join("")}</select>
    <div class="row"><div><label>Menge</label><input id="em" type="number" min="0" step="any"></div>
      <div><label>MHD (leer = Standard)</label><input id="ed" type="date"></div></div>
    <label>Lagerort</label><select id="el"><option value="">Standard des Produkts</option>
      ${orte.map((o) => `<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select>
    <button class="go" id="buchen">Einbuchen</button></div>
    <div class="card"><h2>Bestand</h2>${bestand.length ? `<table>${bestand.map((b) => {
      const cls = b.mhd && b.mhd < today ? "over" : b.mhd && b.mhd <= soon ? "soon" : "";
      return `<tr><td>${esc(b.name)}</td><td class="nw">${fmt(b.menge)} ${esc(b.einheit)}</td>
        <td class="muted">${esc(b.lagerort)}</td><td class="nw ${cls}">${dmy(b.mhd)}</td></tr>`; }).join("")}</table>`
      : `<p class="muted">Leer.</p>`}</div>
    ${reste.length ? `<div class="card"><h2>Reste</h2><table>${reste.map((r) => `<tr><td>${esc(r.name.replace(/^Rest: /, ""))}</td>
      <td class="nw">${fmt(r.portionen)} P.</td><td class="nw ${r.ablauf && r.ablauf < today ? "over" : r.ablauf && r.ablauf <= soon ? "soon" : ""}">${dmy(r.ablauf)}</td>
      <td class="nw" style="text-align:right"><button class="ghost" data-rg="${r.produkt_id}">1 gegessen</button>
        <button class="ghost" data-rw="${r.produkt_id}" data-m="${r.portionen}">weg</button></td></tr>`).join("")}</table></div>` : ""}
    ${fuell.length ? `<div class="card"><h2>Füllstand</h2><table>${fuell.map((f) => `<tr><td>${esc(f.name)}</td>
      <td class="nw" style="text-align:right">${["voll", "knapp", "leer"].map((st) =>
        `<button class="ghost ${f.stand === st ? "on" : ""}" data-fs="${f.produkt_id}" data-st="${st}"
          style="${f.stand === st ? "background:var(--accent);color:#fff;border-color:var(--accent)" : ""}">${st}</button>`).join(" ")}</td></tr>`).join("")}</table>
      <p class="muted" style="font-size:13px">knapp und leer kommen beim nächsten Einkauf auf die Liste.</p></div>` : ""}`;
  document.querySelectorAll("[data-rg]").forEach((b) => b.onclick = () => guarded(async () => {
    await api("bestand/abbuchen", {method: "POST", body: JSON.stringify({produkt_id: b.dataset.rg, menge: 1})});
    say("Guten Appetit"); load("bestand"); }));
  document.querySelectorAll("[data-rw]").forEach((b) => b.onclick = () => guarded(async () => {
    await api("bestand/abbuchen", {method: "POST", body: JSON.stringify({produkt_id: b.dataset.rw, menge: +b.dataset.m, verdorben: true})});
    say("Als verdorben ausgebucht"); load("bestand"); }));
  document.querySelectorAll("#bestand [data-fs]").forEach((b) => b.onclick = () => guarded(async () => {
    await api(`fuellstand/${b.dataset.fs}`, {method: "PUT", body: JSON.stringify({stand: b.dataset.st})});
    load("bestand"); }));
  $("#buchen").onclick = () => guarded(async () => {
    await api("bestand", {method: "POST", body: JSON.stringify({produkt_id: $("#ep").value,
      menge: +$("#em").value, mhd: $("#ed").value || null, lagerort_id: $("#el").value || null})});
    say("Eingebucht"); load("bestand");
  });
}

async function loadPackungen(auswahl) {
  const liste = await api("packungen"), el = $("#packungen");
  if (!liste.length) { el.innerHTML = `<div class="card"><p class="muted">Keine Produkte.</p></div>`; return; }
  const p = liste.find((x) => x.produkt_id === auswahl) ?? liste[0];
  const groesse = (g) => `${esc(g.einheit)} ${fmt(g.menge)} ${esc(p.einheit)}`;
  el.innerHTML = `<div class="card"><h2>Packungsgrößen</h2>
    <label>Produkt</label><select id="pp">${liste.map((x) =>
      `<option value="${x.produkt_id}" ${x.produkt_id === p.produkt_id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
    <label>Standard (meistverkaufte Größe)</label>
    <div class="row"><input id="se" placeholder="Einheit, z. B. Dose" value="${esc(p.standard?.einheit ?? "")}">
      <input id="sm" type="number" min="0" step="any" placeholder="Menge in ${esc(p.einheit)}" value="${p.standard?.menge ?? ""}"></div>
    <button class="go" id="sstd">Standard speichern</button>
    <label>Weitere Größen</label>
    ${p.weitere.length ? `<table>${p.weitere.map((w) => `<tr><td>${groesse(w)}</td>
      <td class="muted">${esc(w.quelle)}${w.gueltig_bis ? " bis " + dmy(w.gueltig_bis) : ""}</td>
      <td style="width:40px"><button data-del="${w.id}" style="border:0;background:none;color:var(--bad);cursor:pointer">✕</button></td></tr>`).join("")}</table>`
      : `<p class="muted">Keine.</p>`}
    <div class="row"><input id="we" placeholder="Einheit"><input id="wm" type="number" min="0" step="any" placeholder="Menge in ${esc(p.einheit)}"></div>
    <button class="go" id="wadd" style="background:none;color:var(--accent);border:1px solid var(--line)">Größe hinzufügen</button></div>
    <div class="card"><h2>Übersicht</h2><table>${liste.map((x) => `<tr><td>${esc(x.name)}</td>
      <td>${x.standard ? `${esc(x.standard.einheit)} ${fmt(x.standard.menge)} ${esc(x.einheit)}` : `<span class="muted">–</span>`}</td>
      <td class="muted">${x.weitere.map((w) => fmt(w.menge)).join(", ")}</td></tr>`).join("")}</table></div>`;
  const id = p.produkt_id;
  $("#pp").onchange = () => guarded(() => loadPackungen($("#pp").value));
  $("#sstd").onclick = () => guarded(async () => {
    await api(`produkte/${id}/packung`, {method: "PUT", body: JSON.stringify({einheit: $("#se").value, menge: +$("#sm").value})});
    say("Standard gespeichert"); loadPackungen(id);
  });
  $("#wadd").onclick = () => guarded(async () => {
    await api(`produkte/${id}/packungen`, {method: "POST", body: JSON.stringify({einheit: $("#we").value, menge: +$("#wm").value})});
    say("Größe hinzugefügt"); loadPackungen(id);
  });
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => guarded(async () => {
    await api(`packungen/${b.dataset.del}`, {method: "DELETE"}); loadPackungen(id);
  }));
}

async function loadImport() {
  $("#import").innerHTML = `<div class="card"><h2>Rezept per Link importieren</h2>
    <label>Link (z. B. HelloFresh)</label><input id="iu" type="url" placeholder="https://www.hellofresh.de/recipes/…">
    <details><summary class="muted" style="margin-top:8px;font-size:13px">Seite blockt? Quelltext einfügen</summary>
      <textarea id="ih" placeholder="Seitenquelltext (Strg+U, alles kopieren)"></textarea></details>
    <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input id="iki" type="checkbox" checked style="width:auto"> Offene Zutaten per KI zuordnen</label>
    <button class="go" id="iload">Vorschau laden</button>
    <p class="muted" style="font-size:13px">Übernommen werden nur Zutaten und Mengen, die Zubereitung bleibt als Link zur Quelle.</p></div>
    <div id="ivor"></div>`;
  $("#iload").onclick = () => guarded(async () => {
    if ($("#iki").checked) say("Lade Rezept, KI ordnet zu …");
    const v = await api("import/vorschau", {method: "POST",
      body: JSON.stringify({url: $("#iu").value, html: $("#ih").value || null, ki: $("#iki").checked})});
    zeigeVorschau(v, await api("produkte"));
  });
}

function zeigeVorschau(v, produkte) {
  const einheit = Object.fromEntries(produkte.map((p) => [p.id, p.einheit]));
  const wert = (z) => z.aktion === "zuordnen" ? z.produkt_id : z.aktion === "neu" ? "+neu" : "";
  const opts = (z) => {
    const sel = wert(z), o = (val, txt) => `<option value="${val}" ${val === sel ? "selected" : ""}>${esc(txt)}</option>`;
    const alt = z.alternativen.map((a) => a.produkt_id);
    return o("+neu", "+ neues Produkt") + o("", "– weglassen –") +
      (alt.length ? `<optgroup label="Ähnlich">${z.alternativen.map((a) => o(a.produkt_id, a.name)).join("")}</optgroup>` : "") +
      `<optgroup label="Alle Produkte">${produkte.filter((p) => !alt.includes(p.id)).map((p) => o(p.id, p.name)).join("")}</optgroup>`;
  };
  const zaehl = (f) => v.zutaten.filter(f).length;
  const pruefen = zaehl((z) => z.status === "pruefen" && z.aktion !== "weglassen");
  $("#ivor").innerHTML = `<div class="card"><h2>Vorschau</h2>
    ${v.dublette ? `<p class="over">Dieses Rezept gibt es schon (ID ${esc(v.dublette)}).</p>` : ""}
    <p class="muted">${zaehl((z) => z.aktion === "zuordnen")} vorhanden · ${zaehl((z) => z.aktion === "neu")} neu ·
      ${zaehl((z) => z.aktion === "weglassen")} weggelassen${pruefen ? ` · <span class="over">${pruefen} prüfen</span>` : ""}</p>
    ${v.ki?.fehler ? `<p class="over">KI nicht erreichbar, nur Code-Vorschlag: ${esc(v.ki.fehler)}</p>` : ""}
    ${v.ki?.geaendert ? `<p class="muted">${v.ki.geaendert} Zutaten von der KI ergänzt (markiert mit „KI“), bitte prüfen.</p>` : ""}
    <div class="row"><div><label>Name</label><input id="in" value="${esc(v.name)}"></div>
      <div style="flex:0 0 90px"><label>Portionen</label><input id="ip" type="number" min="1" max="12" value="${v.portionen}"></div></div>
    <button class="go" id="iok">In Grocy übernehmen</button>
    <table>${v.zutaten.map((z) => `<tr><td colspan="3" style="border-top:1px solid var(--line);padding-bottom:0">
        ${esc(z.text)} ${z.status !== "ok" ? `<span class="tag ${z.status}">${esc(z.status)}</span>` : ""}
        ${z.hinweis ? `<span class="muted" style="font-size:12px"> ${esc(z.hinweis)}</span>` : ""}</td></tr>
      <tr><td style="border:0"><select data-zp="${z.index}">${opts(z)}</select>
          <input data-zn="${z.index}" value="${esc(z.neu_name ?? z.name)}" style="display:${z.aktion === "neu" ? "block" : "none"};margin-top:4px"></td>
        <td style="border:0;width:90px"><input data-zm="${z.index}" type="number" min="0" step="any" value="${z.menge_bestand ?? ""}"></td>
        <td style="border:0;width:30px" class="muted" data-ze="${z.index}">${esc(einheit[z.produkt_id] ?? "g")}</td></tr>`).join("")}</table></div>`;
  document.querySelectorAll("[data-zp]").forEach((sel) => sel.onchange = () => {
    const i = sel.dataset.zp;
    $(`[data-zn="${i}"]`).style.display = sel.value === "+neu" ? "block" : "none";
    $(`[data-ze="${i}"]`).textContent = einheit[sel.value] ?? "g";
  });
  $("#iok").onclick = () => guarded(async () => {
    const zutaten = [];
    for (const sel of document.querySelectorAll("[data-zp]")) {
      const i = +sel.dataset.zp, menge = $(`[data-zm="${i}"]`).value, z = v.zutaten[i];
      if (!sel.value) continue;
      if (menge === "") throw new Error(`Menge fehlt: ${z.text}`);
      zutaten.push(sel.value === "+neu"
        ? {index: i, neu_anlegen: $(`[data-zn="${i}"]`).value, menge: +menge, stueck_g: z.stueck_g}
        : {index: i, produkt_id: sel.value, menge: +menge});
    }
    const e = await api(`import/${v.import_id}/uebernehmen`, {method: "POST", body: JSON.stringify({
      name: $("#in").value, portionen: +$("#ip").value, zutaten, trotz_dublette: !!v.dublette})});
    say(`„${e.name}“ angelegt · ${e.zutaten} Zutaten` + (e.neue_produkte.length ? ` · ${e.neue_produkte.length} neue Produkte` : ""));
    $("#ivor").innerHTML = "";
  });
}

// --- Rezeptbuch -----------------------------------------------------------------
const rbState = {q: "", kochbar: false, tag: ""};
async function loadRezepte() {
  const buch = await api("rezeptbuch"), el = $("#rezepte");
  const tags = [...new Set(buch.flatMap((r) => r.tags))].sort();
  const render = () => {
    const q = rbState.q.toLowerCase();
    const treffer = buch.filter((r) => (!q || r.name.toLowerCase().includes(q))
      && (!rbState.kochbar || r.kochbar) && (!rbState.tag || r.tags.includes(rbState.tag)));
    $("#rbl").innerHTML = treffer.length ? treffer.map((r) => `<div data-r="${r.id}">
      <b>${esc(r.name)}</b> <span class="muted">· ${r.portionen} P.</span>
      ${r.status === "ungetestet" ? `<span class="tag">neu</span>` : ""}
      <div class="muted" style="font-size:13px">${r.kochbar ? `<span class="dot"></span>alles da`
        : `<span class="dot ${r.fehlend.length > 2 ? "fehlt" : "knapp"}"></span>${r.fehlend.length} fehlen`}
        ${r.tags.length ? " · " + r.tags.map(esc).join(", ") : ""}${r.aufwand ? " · " + esc(r.aufwand) : ""}</div></div>`).join("")
      : `<p class="muted">Keine Rezepte gefunden.</p>`;
    document.querySelectorAll("[data-r]").forEach((d) => d.onclick = () => guarded(() => zeigeRezept(d.dataset.r)));
  };
  el.innerHTML = `<div class="card"><h2>Rezeptbuch <span class="muted">(${buch.length})</span></h2>
    <input id="rbq" placeholder="Suchen …" value="${esc(rbState.q)}">
    <div class="chips"><button id="rbk" class="${rbState.kochbar ? "on" : ""}">Jetzt kochbar</button>
      ${tags.map((t) => `<button data-tag="${esc(t)}" class="${rbState.tag === t ? "on" : ""}">${esc(t)}</button>`).join("")}</div>
    <div class="list" id="rbl" style="margin-top:8px"></div></div><div id="rbd"></div>`;
  $("#rbq").oninput = () => { rbState.q = $("#rbq").value; render(); };
  $("#rbk").onclick = () => { rbState.kochbar = !rbState.kochbar; loadRezepte(); };
  document.querySelectorAll("[data-tag]").forEach((b) => b.onclick = () => {
    rbState.tag = rbState.tag === b.dataset.tag ? "" : b.dataset.tag; loadRezepte(); });
  render();
}

  $("#rbd").innerHTML = `<div class="card">
    <button class="ghost" id="rzurueck">← Rezeptbuch</button>
    <h2 style="margin-top:10px">${esc(r.name)}</h2>
    <p class="muted">${[r.status, r.aufwand, ...r.tags].filter(Boolean).map(esc).join(" · ")}

    <div class="row" style="align-items:center"><div style="flex:0 0 auto">Portionen</div>
      <div style="flex:0 0 90px"><input id="rpor" type="number" min="1" max="24" value="${r.portionen}"></div><div></div></div>
    <h2 style="margin-top:12px">Zutaten</h2>
    <table>${r.zutaten.map((z) => `<tr><td><span class="dot ${z.ampel}"></span>${esc(z.name)}

      <td class="nw">${fmt(z.menge)} ${esc(z.einheit)}</td><td class="nw muted">da: ${fmt(z.bestand)}</td></tr>`).join("")}</table>
    ${r.schritte.length ? `<h2 style="margin-top:12px">Zubereitung</h2><ol>${r.schritte.map((t) => `<li>${esc(t)}</li>`).join("")}</ol>` : ""}
    <div class="row"><button class="go" id="rheute">Heute kochen</button>

async function bearbeiteRezept(id) {
  const [r, produkte] = await Promise.all([api(`rezepte/${id}`), api("produkte")]);
  const opt = (sel) => produkte.map((p) => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(p.name)} (${esc(p.einheit)})</option>`).join("");
  const zeile = (z = {}) => `<tr data-zrow><td><select data-zp>${opt(z.produkt_id)}</select>
      <input data-zn placeholder="Notiz" value="${esc(z.notiz ?? "")}" style="margin-top:4px"></td>
    <td style="width:90px"><input data-zm type="number" min="0" step="any" value="${z.menge_basis ?? ""}"></td>
    <td style="width:30px"><button class="ghost" data-zdel>✕</button></td></tr>`;
  const sel = (id_, werte, wert) => `<select id="${id_}"><option value="">–</option>${werte.map((w) =>
    `<option ${w === wert ? "selected" : ""}>${w}</option>`).join("")}</select>`;
  $("#rbd").innerHTML = `<div class="card"><h2>Rezept bearbeiten</h2>
    <label>Name</label><input id="ename" value="${esc(r.name)}">
    <div class="row"><div><label>Portionen</label><input id="epor" type="number" min="1" max="24" value="${r.portionen_basis}"></div>
      <div><label>Status</label>${sel("estat", ["getestet", "ungetestet"], r.status)}</div>
      <div><label>Aufwand</label>${sel("eauf", ["schnell", "normal", "aufwaendig"], r.aufwand)}</div></div>
    <label>Tags (mit Komma)</label><input id="etags" value="${esc(r.tags.join(", "))}">
    <label>Zutaten (Mengen für ${r.portionen_basis} Portionen, in Bestandseinheit)</label>
    <table id="ezut">${r.zutaten.map(zeile).join("")}</table>
    <button class="ghost" id="ezadd" style="margin-top:6px">+ Zutat</button>
    <label>Zubereitung (ein Schritt pro Zeile)</label><textarea id="eschr" style="font:inherit;min-height:140px">${esc(r.schritte.join("\n"))}</textarea>
    <div class="row"><button class="go" id="esave">Speichern</button>
      <button class="go" id="eabbr" style="background:none;color:var(--accent);border:1px solid var(--line)">Abbrechen</button></div></div>`;
  const bindDel = () => document.querySelectorAll("[data-zdel]").forEach((b) => b.onclick = () => b.closest("tr").remove());
  bindDel();
  $("#ezadd").onclick = () => { $("#ezut").insertAdjacentHTML("beforeend", zeile()); bindDel(); };
  $("#eabbr").onclick = () => guarded(() => zeigeRezept(id));
  $("#esave").onclick = () => guarded(async () => {
    const zutaten = [...document.querySelectorAll("[data-zrow]")].map((tr) => ({
      produkt_id: tr.querySelector("[data-zp]").value, menge: +tr.querySelector("[data-zm]").value,
      notiz: tr.querySelector("[data-zn]").value || null}));
    const body = {name: $("#ename").value, portionen: +$("#epor").value, zutaten,
      tags: $("#etags").value.split(",").map((t) => t.trim()).filter(Boolean),
      schritte: $("#eschr").value.split("\n")};
    if ($("#estat").value) body.status = $("#estat").value;
    if ($("#eauf").value) body.aufwand = $("#eauf").value;
    await api(`rezepte/${id}`, {method: "PATCH", body: JSON.stringify(body)});
    say("Rezept gespeichert"); zeigeRezept(id);
  });
}

    $("#pdl").innerHTML = t.map((p) => `<div data-p="${p.id}"><b>${esc(p.name)}</b>
      <span class="muted">· ${esc(p.tracking_modus ?? "ohne Attribute")}${p.kategorie ? " · " + esc(p.kategorie) : ""}</span>
      <div class="muted" style="font-size:13px">Bestand ${fmt(p.bestand)} ${esc(p.einheit)}
        ${p.packung ? ` · ${esc(p.packung.einheit)} ${fmt(p.packung.menge)} ${esc(p.einheit)}` : ""}

  };

    <div class="card"><h2>Produkte <span class="muted">(${liste.length})</span></h2>

function zeigeDublette(dub, i) {
  const k = dub[i];
  const seite = (p, key) => `<div><label style="margin:0 0 6px;display:flex;gap:6px;color:var(--text)">
      <input type="radio" name="keep" value="${p.id}" ${key === "a" ? "checked" : ""} style="width:auto"> <b>${esc(p.name)}</b></label>
    <dl><dt>Einheit</dt><dd>${esc(p.einheit)}</dd><dt>Bestand</dt><dd>${fmt(p.bestand)} ${esc(p.einheit)}</dd>
    <dt>Modus</dt><dd>${esc(p.tracking_modus ?? "–")}</dd><dt>Packung</dt><dd>${p.packung ? `${esc(p.packung.einheit)} ${fmt(p.packung.menge)}` : "–"}</dd>
    <dt>Kategorie</dt><dd>${esc(p.kategorie ?? "–")}</dd><dt>ID</dt><dd>${esc(p.id)}</dd></dl></div>`;
  $("#dubc").innerHTML = `<h2>Mögliche Dublette ${i + 1}/${dub.length} <span class="muted">· ${Math.round(k.score * 100)} % · ${esc(k.grund)}</span></h2>
    <p class="muted" style="font-size:13px">Auswählen, welches Produkt bleibt. Bestand, Rezepte, Aliase und Packungen wandern dorthin, das andere wird in Grocy gelöscht.</p>
    <div class="pair">${seite(k.a, "a")}${seite(k.b, "b")}</div>
    <div class="row"><button class="go" id="dmerge">Mergen</button>
      <button class="go" id="dnein" style="background:none;color:var(--accent);border:1px solid var(--line)">Nicht mergen</button></div>
    ${dub.length > 1 ? `<button class="ghost" id="dnext" style="margin-top:8px">Später, nächstes Paar →</button>` : ""}`;
  const keep = () => document.querySelector("input[name=keep]:checked").value;
  $("#dmerge").onclick = () => guarded(async () => {
    const behalten = keep(), entfernen = behalten === k.a.id ? k.b.id : k.a.id;
    const e = await api("dubletten/mergen", {method: "POST", body: JSON.stringify({behalten, entfernen})});
    say(`„${e.entfernt}“ in „${e.behalten}“ zusammengeführt`); loadProdukte();
  });
  $("#dnein").onclick = () => guarded(async () => {
    await api("dubletten/ignorieren", {method: "POST", body: JSON.stringify({behalten: k.a.id, entfernen: k.b.id})});
    say("Gemerkt: kein Duplikat"); loadProdukte();
  });
  if ($("#dnext")) $("#dnext").onclick = () => zeigeDublette(dub, (i + 1) % dub.length);
}

    <button class="go" id="psave">Speichern</button></div>

async function loadBon(offen) {
  const liste = await api("bon"), el = $("#bon");
  el.innerHTML = `<div class="card"><h2>Kassenbon fotografieren</h2>
    <input id="bf" type="file" accept="image/*" capture="environment">
    <button class="go" id="bup">Hochladen</button>
    <p class="muted" style="font-size:13px">Die KI liest den Bon im Hintergrund (ca. 30 s). Du bekommst eine Benachrichtigung.</p></div>
    <div id="bdet"></div>
    <div class="card"><h2>Letzte Bons</h2>${liste.length ? `<div class="list">${liste.map((b) => `<div data-bon="${b.id}">
      <b>${esc(b.markt ?? "Bon " + b.id)}</b> <span class="muted">· ${dmy(b.datum ?? b.angelegt)}${b.summe ? " · " + eur(b.summe) : ""}</span>
      <span class="tag ${b.status === "fehler" ? "pruefen" : b.status === "review" ? "schaetzung" : ""}">${esc(b.status)}</span></div>`).join("")}</div>`
      : `<p class="muted">Noch keine.</p>`}</div>`;
  $("#bup").onclick = () => guarded(async () => {
    const f = $("#bf").files[0]; if (!f) throw new Error("Erst ein Foto wählen");
    const fd = new FormData(); fd.append("datei", f);
    const r = await api("bon", {method: "POST", body: fd});
    say("Hochgeladen, wird gelesen …"); loadBon(r.id);
  });
  document.querySelectorAll("[data-bon]").forEach((d) => d.onclick = () => guarded(() => zeigeBon(+d.dataset.bon)));
  if (offen) zeigeBon(offen);
}

async function zeigeBon(id) {
  const [bon, produkte] = await Promise.all([api(`bon/${id}`), api("produkte")]);
  const el = $("#bdet");
  if (bon.status === "verarbeitung") {
    el.innerHTML = `<div class="card"><h2>Bon ${id}</h2><p class="muted">Wird gelesen …</p></div>`;
    clearTimeout(zeigeBon.t); zeigeBon.t = setTimeout(() => guarded(() => zeigeBon(id)), 3000); return;
  }
  if (bon.status !== "review") {
    el.innerHTML = `<div class="card"><h2>${esc(bon.markt ?? "Bon " + id)}</h2><p class="${bon.status === "fehler" ? "over" : "muted"}">
      ${esc(bon.status)}${bon.fehler ? ": " + esc(bon.fehler) : ""}</p></div>`; return;
  }
  const einheit = Object.fromEntries(produkte.map((p) => [p.id, p.einheit]));
  const opts = (z) => `<option value="+neu" ${z.aktion === "neu" ? "selected" : ""}>+ neues Produkt</option>` +
    produkte.map((p) => `<option value="${p.id}" ${p.id === z.produkt_id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  const zeilen = bon.positionen.filter((z) => z.aktion !== "weglassen");
  el.innerHTML = `<div class="card"><h2>${esc(bon.markt ?? "Bon")} <span class="muted">· ${dmy(bon.datum)} · ${eur(bon.summe ?? 0)}</span></h2>
    <p class="muted" style="font-size:13px">Haken = wird gebucht. Vorausgewählt sind bekannte Bon-Texte und sichere KI-Treffer.
      ${bon.positionen.length - zeilen.length} Zeilen (Pfand, Rabatt …) ignoriert.</p>
    <table>${zeilen.map((z) => `<tr><td colspan="3" style="padding-bottom:0">
        <label style="display:flex;gap:6px;margin:0;color:var(--text)"><input type="checkbox" data-bc="${z.index}" ${z.vorausgewaehlt ? "checked" : ""} style="width:auto">
        ${esc(z.text)}</label> <span class="tag ${z.status === "sicher" ? "" : z.status === "vorschlag" ? "schaetzung" : "pruefen"}">${esc(z.quelle)}</span>
        ${z.hinweis ? `<span class="muted" style="font-size:12px">${esc(z.hinweis)}</span>` : ""}</td></tr>
      <tr><td style="border:0"><select data-bp="${z.index}">${opts(z)}</select>
        <input data-bn="${z.index}" value="${esc(z.neu_name ?? "")}" style="display:${z.aktion === "neu" ? "block" : "none"};margin-top:4px"></td>
        <td style="border:0;width:85px"><input data-bm="${z.index}" type="number" min="0" step="any" value="${z.menge ?? ""}"></td>
        <td style="border:0;width:70px" class="muted"><span data-be="${z.index}">${esc(z.einheit ?? "g")}</span><br>${z.preis != null ? eur(z.preis) : ""}</td></tr>`).join("")}</table>
    <div class="row"><button class="go" id="bbuchen">Ausgewählte buchen</button>
      <button class="go" id="bweg" style="background:none;color:var(--accent);border:1px solid var(--line)">Verwerfen</button></div></div>`;
  document.querySelectorAll("[data-bp]").forEach((sel) => sel.onchange = () => {
    const i = sel.dataset.bp;
    $(`[data-bn="${i}"]`).style.display = sel.value === "+neu" ? "block" : "none";
    $(`[data-be="${i}"]`).textContent = einheit[sel.value] ?? "g";
    $(`[data-bc="${i}"]`).checked = true;
  });
  $("#bbuchen").onclick = () => guarded(async () => {
    const positionen = [];
    for (const z of zeilen) {
      if (!$(`[data-bc="${z.index}"]`).checked) continue;
      const sel = $(`[data-bp="${z.index}"]`).value, menge = $(`[data-bm="${z.index}"]`).value;
      if (!menge) throw new Error(`Menge fehlt: ${z.text}`);
      positionen.push({index: z.index, menge: +menge, preis: z.preis,
        ...(sel === "+neu" ? {neu_anlegen: $(`[data-bn="${z.index}"]`).value} : {produkt_id: sel})});
    }
    const e = await api(`bon/${id}/buchen`, {method: "POST", body: JSON.stringify({positionen})});
    say(`${e.gebucht.length} Positionen eingebucht` + (e.neue_produkte.length ? ` · ${e.neue_produkte.length} neue Produkte` : ""));
    loadBon();
  });
  $("#bweg").onclick = () => guarded(async () => { await api(`bon/${id}/verwerfen`, {method: "POST"}); loadBon(); });
}

function load(tab) {
  guarded(loadStatus);
  return guarded({heute: loadHeute, woche: loadWoche, rezepte: loadRezepte, bestand: loadBestand,
    produkte: loadProdukte, packungen: () => loadPackungen(), bon: () => loadBon(), import: loadImport}[tab]);
}
load("heute");
</script>
</body>
</html>
